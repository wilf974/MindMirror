<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
  <rect width="192" height="192" rx="32" fill="url(#bg)"/>
  <g transform="translate(96 96)">
    <!-- Miroir ovale -->
    <ellipse rx="48" ry="58" fill="#ffffff" stroke="#f5f3ff" stroke-width="3"/>
    <!-- Reflet circulaire intérieur (cerveau stylisé) -->
    <ellipse rx="40" ry="50" fill="#f5f3ff"/>
    <!-- Hémisphère gauche -->
    <path d="M -20 -22 Q -30 -10, -28 5 Q -32 18, -22 28 Q -12 30, -8 22 Q -16 12, -14 0 Q -18 -10, -20 -22 Z" fill="#7c3aed"/>
    <!-- Hémisphère droit -->
    <path d="M 20 -22 Q 30 -10, 28 5 Q 32 18, 22 28 Q 12 30, 8 22 Q 16 12, 14 0 Q 18 -10, 20 -22 Z" fill="#a78bfa"/>
    <!-- Manche du miroir -->
    <rect x="-6" y="56" width="12" height="20" rx="3" fill="#ffffff"/>
  </g>
</svg>
